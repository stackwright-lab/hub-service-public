[project]
name = "hub-service-public"
version = "1.0.1"
description = "Interroger les données publiques françaises (data.gouv.fr, ADEME, BAN) depuis Claude : index local, accès en direct, tableau de bord de santé"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
]

license = "EUPL-1.2"
keywords = ["data.gouv.fr", "open data", "mcp", "claude", "service public"]

[project.urls]
Source = "https://github.com/stackwright-lab/hub-services-publics"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hub-harvest = "hub_service_public.harvest:main"
hub-server = "hub_service_public.server:main"
hub-health = "hub_service_public.health:main"
hub-dashboard = "hub_service_public.dashboard:main"
hub-web = "hub_service_public.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_service_public"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
