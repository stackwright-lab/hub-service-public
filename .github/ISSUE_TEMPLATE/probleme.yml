name: Signaler un problème
description: Une réponse fausse, une erreur, une page qui ne s'ouvre pas
labels: ["bug"]
body:
  - type: textarea
    id: question
    attributes:
      label: Ce que vous avez fait
      description: La question posée ou l'action réalisée (sans donnée personnelle).
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce que vous attendiez
    validations:
      required: true
  - type: textarea
    id: obtenu
    attributes:
      label: Ce que vous avez obtenu
      description: Message d'erreur, capture d'écran, état des sources affiché.
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Environnement
      description: Système (macOS, Windows, Linux), navigateur, mode (page web, application Claude, Claude Code).
